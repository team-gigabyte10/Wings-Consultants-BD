<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="100%">
  <!-- 5-Color Pinwheel Swirl Emblem -->
  <g transform="translate(6, 5)">
    <path d="M 50,12 C 66,13 80,24 85,38 C 76,42 66,42 58,47 C 52,51 48,56 47,60 C 45,48 45,32 50,12 Z" fill="#ED1C24" transform="rotate(0 50 50)" />
    <path d="M 50,12 C 66,13 80,24 85,38 C 76,42 66,42 58,47 C 52,51 48,56 47,60 C 45,48 45,32 50,12 Z" fill="#0072BC" transform="rotate(72 50 50)" />
    <path d="M 50,12 C 66,13 80,24 85,38 C 76,42 66,42 58,47 C 52,51 48,56 47,60 C 45,48 45,32 50,12 Z" fill="#00AEEF" transform="rotate(144 50 50)" />
    <path d="M 50,12 C 66,13 80,24 85,38 C 76,42 66,42 58,47 C 52,51 48,56 47,60 C 45,48 45,32 50,12 Z" fill="#8DC63F" transform="rotate(216 50 50)" />
    <path d="M 50,12 C 66,13 80,24 85,38 C 76,42 66,42 58,47 C 52,51 48,56 47,60 C 45,48 45,32 50,12 Z" fill="#F26522" transform="rotate(288 50 50)" />

    <!-- Center negative space hub -->
    <circle cx="50" cy="50" r="8" fill="#ffffff" />
  </g>

  <!-- Typography: 'pure' and 'enterprise' -->
  <g transform="translate(112, 0)">
    <!-- 'pure' -->
    <text x="0" y="74" font-family="'Century Gothic', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="86" fill="#009FE3" letter-spacing="-2px">pure</text>
    
    <!-- 'enterprise' -->
    <text x="3" y="102" font-family="'Century Gothic', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="28" fill="#18181b" letter-spacing="3.5px">enterprise</text>
  </g>
</svg>