<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c17" />
      <stop offset="50%" stop-color="#0B1221" />
      <stop offset="100%" stop-color="#14213d" />
    </linearGradient>
    <linearGradient id="wingGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wingGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="280" cy="315" r="300" fill="url(#goldGlow)" />

  <!-- Logo Emblem scaled up -->
  <g transform="translate(140, 175) scale(1.4)">
    <!-- Outer Circular Ring (Top arc) -->
    <path
      d="M 28 85 A 76 76 0 0 1 172 85"
      stroke="#38bdf8"
      stroke-width="6.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Bottom Circle Arch -->
    <path
      d="M 52 142 A 76 76 0 0 0 148 142"
      stroke="#64748b"
      stroke-width="4"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Left Wing -->
    <path d="M 90 75 C 65 60 30 40 24 35 C 22 45 35 65 52 78 C 65 88 85 92 90 92 Z" fill="url(#wingGradLeft)" />
    <path d="M 85 92 C 60 82 32 68 28 62 C 26 72 38 88 56 98 C 68 105 82 106 85 106 Z" fill="url(#wingGradLeft)" />
    <path d="M 80 108 C 60 102 38 92 34 88 C 34 96 45 110 62 118 C 72 122 80 120 80 120 Z" fill="url(#wingGradLeft)" />

    <!-- Right Wing -->
    <path d="M 110 75 C 135 60 170 40 176 35 C 178 45 165 65 148 78 C 135 88 115 92 110 92 Z" fill="url(#wingGradRight)" />
    <path d="M 115 92 C 140 82 168 68 172 62 C 174 72 162 88 144 98 C 132 105 118 106 115 106 Z" fill="url(#wingGradRight)" />
    <path d="M 120 108 C 140 102 162 92 166 88 C 166 96 155 110 138 118 C 128 122 120 120 120 120 Z" fill="url(#wingGradRight)" />

    <!-- Center 'W' Shape -->
    <polygon points="60,68 76,68 93,128 80,128" fill="#38bdf8" />
    <polygon points="140,68 124,68 107,128 120,128" fill="#38bdf8" />
    <polygon points="80,128 93,128 100,82 91,82" fill="#0284c7" />
    <polygon points="120,128 107,128 100,82 109,82" fill="#0369a1" />
    <polygon points="85,68 115,68 100,98" fill="#f8fafc" />
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(480, 210)">
    <!-- Pill tag -->
    <rect x="0" y="0" width="340" height="36" rx="18" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" />
    <text x="170" y="23" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#fbbf24" text-anchor="middle" letter-spacing="2">25+ YEARS OF EXCELLENCE</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="Georgia, serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="1.5">WINGS CONSULTANTS BD</text>
    <text x="0" y="126" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#38bdf8" letter-spacing="3">(A PROFESSIONAL CONSULTANCY FIRM)</text>

    <!-- Subtitle -->
    <text x="0" y="180" font-family="system-ui, sans-serif" font-size="20" fill="#cbd5e1">Taxation • Bank Projects • Factory Setup • Corporate Advisory</text>
    <text x="0" y="212" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">Motijheel / Gulshan Commercial Area, Dhaka, Bangladesh</text>
  </g>
</svg>

